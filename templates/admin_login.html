<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <h2>Admin Login</h2>

        <p style="color: gray;">
            Authorized personnel only
        </p>

        <form method="POST">

            <input type="password"
                   name="password"
                   placeholder="Enter Admin Password"
                   required>

            <button type="submit">
                Login as Admin
            </button>

        </form>

        <p>
            <a href="/">
                ← Back to User Login
            </a>
        </p>

    </div>

</div>

</body>
</html>
